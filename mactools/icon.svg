<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Speedometer Gauge Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- RAM Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Metallic/Gold Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (macOS HIG) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2.5"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="245" r="160" fill="url(#coreGlow)"/>

  <!-- Outer Speedometer / Activity Gauge Arc -->
  <!-- Background Track Arc -->
  <path d="M 120 330 A 155 155 0 1 1 392 330" 
        fill="none" 
        stroke="#334155" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- Active Colored Gauge Arc with Glow -->
  <path d="M 120 330 A 155 155 0 1 1 350 145" 
        fill="none" 
        stroke="url(#arcGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#neonGlow)"/>

  <!-- Gauge Tick Marks -->
  <line x1="145" y1="300" x2="155" y2="290" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="240" x2="138" y2="240" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="180" x2="157" y2="190" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="112" x2="256" y2="126" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="367" y1="180" x2="355" y2="190" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="387" y1="240" x2="374" y2="240" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <!-- Memory Chip / RAM Board (Centerpiece) -->
  <g transform="translate(166, 175)">
    <!-- RAM PCB Board -->
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#0B132B" stroke="#0284C7" stroke-width="3.5"/>

    <!-- RAM Individual IC Chips -->
    <rect x="14" y="20" width="32" height="48" rx="4" fill="url(#chipGrad)"/>
    <rect x="54" y="20" width="32" height="48" rx="4" fill="url(#chipGrad)"/>
    <rect x="94" y="20" width="32" height="48" rx="4" fill="url(#chipGrad)"/>
    <rect x="134" y="20" width="32" height="48" rx="4" fill="url(#chipGrad)"/>

    <!-- Chip Laser Etching Details -->
    <circle cx="20" cy="28" r="2.5" fill="#E0F2FE"/>
    <circle cx="60" cy="28" r="2.5" fill="#E0F2FE"/>
    <circle cx="100" cy="28" r="2.5" fill="#E0F2FE"/>
    <circle cx="140" cy="28" r="2.5" fill="#E0F2FE"/>

    <!-- Bottom Gold Connector Pins -->
    <rect x="16" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="28" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="40" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="52" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="64" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <!-- Key notch gap -->
    <rect x="88" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="100" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="112" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="124" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="136" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="148" y="94" width="8" height="16" rx="2" fill="url(#pinGrad)"/>
    <rect x="160" y="94" width="6" height="16" rx="2" fill="url(#pinGrad)"/>

    <!-- PCB Traces / Circuit Lines -->
    <path d="M 30 76 L 30 86" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 70 76 L 70 86" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 110 76 L 110 86" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 150 76 L 150 86" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- Network Bandwidth Real-Time Badges (Bottom Center) -->
  <g transform="translate(196, 335)">
    <!-- Pill Container -->
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#0B132B" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

    <!-- Upload Arrow (Green) -->
    <path d="M 28 24 L 28 12 M 23 16 L 28 11 L 33 16" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Download Arrow (Cyan) -->
    <path d="M 88 12 L 88 24 M 83 20 L 88 25 L 93 20" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Dot -->
    <circle cx="58" cy="18" r="3" fill="#64748B"/>
  </g>
</svg>

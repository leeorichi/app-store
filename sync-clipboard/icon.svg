<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Clasp Metal Gradient -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Accent / Checkmark Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Main Clipboard Plate -->
  <rect x="116" y="112" width="280" height="312" rx="36" fill="url(#boardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>

  <!-- Decorative Document Lines on Clipboard -->
  <rect x="160" y="240" width="120" height="12" rx="6" fill="#334155"/>
  <rect x="160" y="272" width="192" height="12" rx="6" fill="#1E293B"/>
  <rect x="160" y="304" width="156" height="12" rx="6" fill="#1E293B"/>

  <!-- Dynamic Success Checkmark with Glow -->
  <path d="M 196 200 L 236 240 L 324 150" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowEffect)"/>

  <!-- Top Clasp Holder Base -->
  <rect x="196" y="92" width="120" height="52" rx="14" fill="url(#claspGrad)"/>
  <rect x="226" y="76" width="60" height="32" rx="10" fill="#0F172A" stroke="url(#claspGrad)" stroke-width="4"/>

  <!-- Sync Cross-Device Lightning / Connection Indicator (Bottom Right Badge) -->
  <g transform="translate(320, 340)">
    <circle cx="36" cy="36" r="42" fill="#0F172A" stroke="#38BDF8" stroke-width="4" filter="url(#dropShadow)"/>
    <!-- Lightning Bolt / Sync Flash -->
    <path d="M 40 18 L 24 38 L 36 38 L 32 54 L 48 34 L 36 34 Z" fill="#38BDF8"/>
  </g>

  <!-- Cross-Device Signal Waves (Top Left) -->
  <path d="M 136 96 A 36 36 0 0 0 96 136" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 124 84 A 52 52 0 0 0 72 136" stroke="#818CF8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
